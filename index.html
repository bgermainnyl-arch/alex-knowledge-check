<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whole Life Insurance — Knowledge Check</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #ffffff;
      margin-bottom: 2rem;
      font-size: 1.5rem;
      text-align: center;
      padding: 0 1rem;
    }
    elevenlabs-convai {
      display: block;
      position: static !important;
    }
  </style>
</head>
<body>
  <h1>Whole Life Insurance — Knowledge Check</h1>

  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed"
          async type="text/javascript"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var userID = params.get('user_id') || 'Unknown';
    var courseID = params.get('course_id') || 'NYL-BG-TEST';

    var widget = document.createElement('elevenlabs-convai');
    widget.setAttribute('agent-id', 'agent_6601kpbt8628er29rfw2x8zesrby');
    widget.setAttribute('dynamic-variables', JSON.stringify({
      user_id: userID,
      course_id: courseID
    }));
    document.body.appendChild(widget);

    // Watch for shadow DOM and override fixed positioning
    var observer = new MutationObserver(function() {
      var shadow = widget.shadowRoot;
      if (shadow) {
        var style = document.createElement('style');
        style.textContent = `
          :host { position: static !important; }
          * { position: static !important; bottom: auto !important; right: auto !important; }
        `;
        shadow.appendChild(style);
        observer.disconnect();
      }
    });
    observer.observe(widget, { childList: true, subtree: true });
  </script>
</body>
</html>
